name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agentshield tests
      - run: node --check agentshield/static/app.js
      - run: pip-audit -r requirements.txt
      - run: docker build -t agentshield-ci .

  production-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agentshield
          POSTGRES_USER: agentshield
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentshield -d agentshield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Exercise PostgreSQL, Redis, Celery, and the production API path
        env:
          AGENTSHIELD_ENV: production
          AGENTSHIELD_DATABASE_URL: "postgresql://agentshield:ci-postgres-password@localhost:5432/agentshield"
          AGENTSHIELD_REDIS_URL: "redis://localhost:6379/0"
          AGENTSHIELD_BOOTSTRAP_API_KEY: ash_ci_bootstrap_key_32_chars_minimum_for_testing
          AGENTSHIELD_PLATFORM_API_KEY: ash_ci_platform_key_32_chars_minimum_for_testing
          AGENTSHIELD_ALLOWED_HOSTS: testserver
        run: python tests/production_smoke.py
